<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Packrun 系统架构链路图">
  <rect width="1200" height="420" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#111827">Packrun 部署链路</text>
  <text x="40" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#6b7280">单二进制内嵌前端；Nginx 与 frp 按需启用</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- 浏览器 -->
    <rect x="40" y="140" width="170" height="110" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="125" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">浏览器</text>
    <text x="125" y="213" text-anchor="middle" font-size="16" fill="#1e40af">部署控制台</text>
    <text x="125" y="235" text-anchor="middle" font-size="14" fill="#3b82f6">上传 · 执行 · 回执</text>

    <!-- Nginx -->
    <rect x="268" y="140" width="170" height="110" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="353" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#4c1d95">Nginx</text>
    <text x="353" y="213" text-anchor="middle" font-size="16" fill="#5b21b6">TLS · 限流</text>
    <text x="353" y="235" text-anchor="middle" font-size="14" fill="#7c3aed">可选</text>

    <!-- frp -->
    <rect x="496" y="140" width="170" height="110" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="581" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#134e4a">frp 隧道</text>
    <text x="581" y="213" text-anchor="middle" font-size="16" fill="#0f766e">frps → frpc</text>
    <text x="581" y="235" text-anchor="middle" font-size="14" fill="#0d9488">可选</text>

    <!-- 中控 -->
    <rect x="724" y="128" width="240" height="134" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="844" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#065f46">Go 中控服务</text>
    <text x="844" y="199" text-anchor="middle" font-size="16" fill="#047857">Gin + SQLite + 包仓库</text>
    <text x="844" y="224" text-anchor="middle" font-size="16" fill="#047857">认证 · 调度 · 审计</text>
    <text x="844" y="247" text-anchor="middle" font-size="14" fill="#059669">:9000 /packrun</text>

    <!-- 业务服务器 -->
    <rect x="1018" y="140" width="150" height="110" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="1093" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#7c2d12">业务服务器</text>
    <text x="1093" y="213" text-anchor="middle" font-size="16" fill="#9a3412">目录 + 脚本</text>
    <text x="1093" y="235" text-anchor="middle" font-size="14" fill="#c2410c">N 台</text>

    <!-- 箭头 -->
    <g stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ar)">
      <path d="M212 195 H264"/>
      <path d="M440 195 H492"/>
      <path d="M668 195 H720"/>
      <path d="M966 195 H1014"/>
    </g>
    <text x="238" y="132" text-anchor="middle" font-size="13" fill="#6b7280">HTTPS</text>
    <text x="466" y="132" text-anchor="middle" font-size="13" fill="#6b7280">反代</text>
    <text x="694" y="132" text-anchor="middle" font-size="13" fill="#6b7280">回环</text>
    <text x="990" y="132" text-anchor="middle" font-size="13" fill="#6b7280">SSH</text>

    <!-- 存储 -->
    <rect x="724" y="300" width="114" height="58" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <text x="781" y="326" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">SQLite</text>
    <text x="781" y="347" text-anchor="middle" font-size="13" fill="#6b7280">任务 / 审计</text>
    <rect x="850" y="300" width="114" height="58" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <text x="907" y="326" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">包仓库</text>
    <text x="907" y="347" text-anchor="middle" font-size="13" fill="#6b7280">zip / jar</text>
    <path d="M790 264 V296 M900 264 V296" stroke="#9ca3af" stroke-width="2" fill="none"/>

    <text x="40" y="365" font-size="15" fill="#4b5563">凭据只存引用或 AES-256-GCM 密文；主机指纹 TOFU 校验，部署目录强制绝对路径。</text>
  </g>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
