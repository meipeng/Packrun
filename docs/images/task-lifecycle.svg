<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="任务状态流转图">
  <rect width="1200" height="250" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="248" rx="17" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="48" font-size="27" font-weight="700" fill="#111827">任务状态流转</text>
    <text x="40" y="76" font-size="16" fill="#6b7280">任务号贯穿日志与审计；异常中断会统一收口，不会卡在执行中</text>

    <g font-size="17" font-weight="600" text-anchor="middle">
      <rect x="40" y="110" width="150" height="56" rx="28" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
      <text x="115" y="145" fill="#374151">排队中</text>
      <rect x="250" y="110" width="150" height="56" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <text x="325" y="145" fill="#1e40af">上传中</text>
      <rect x="460" y="110" width="150" height="56" rx="28" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
      <text x="535" y="145" fill="#5b21b6">校验中</text>
      <rect x="670" y="110" width="150" height="56" rx="28" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
      <text x="745" y="145" fill="#9a3412">执行中</text>
      <rect x="900" y="102" width="130" height="56" rx="28" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
      <text x="965" y="137" fill="#065f46">成功</text>
      <rect x="900" y="170" width="130" height="56" rx="28" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
      <text x="965" y="205" fill="#991b1b">失败 / 取消</text>
    </g>

    <g stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ar3)">
      <path d="M192 138 H246"/>
      <path d="M402 138 H456"/>
      <path d="M612 138 H666"/>
      <path d="M822 130 H896"/>
      <path d="M822 150 Q860 198 896 198"/>
      <path d="M115 168 Q115 212 300 212 Q700 212 940 198" stroke-dasharray="6 5"/>
    </g>
    <text x="330" y="232" font-size="14" fill="#6b7280">服务重启 / 手动取消：未完成的任务统一标记为失败并写审计</text>
  </g>
  <defs>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
