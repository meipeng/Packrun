<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="部署向导三步操作图">
  <rect width="1200" height="380" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="50" font-size="28" font-weight="700" fill="#111827">部署向导：三步完成一次发布</text>
    <text x="40" y="78" font-size="16" fill="#6b7280">菜单「部署向导」· 仅管理员与发布者可见</text>

    <!-- Step 1 -->
    <rect x="40" y="110" width="340" height="180" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="76" cy="148" r="19" fill="#2563eb"/>
    <text x="76" y="155" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">1</text>
    <text x="106" y="155" font-size="21" font-weight="700" fill="#1e3a8a">选择目标</text>
    <text x="66" y="194" font-size="16" fill="#1e40af">· 选服务器（可看实时负载）</text>
    <text x="66" y="222" font-size="16" fill="#1e40af">· 选部署目录（绝对路径）</text>
    <text x="66" y="250" font-size="15" fill="#3b82f6">目录策略：覆盖 / 备份 / 自动解压</text>
    <rect x="66" y="265" width="288" height="1" fill="#bfdbfe"/>

    <!-- Step 2 -->
    <rect x="430" y="110" width="340" height="180" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="466" cy="148" r="19" fill="#059669"/>
    <text x="466" y="155" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">2</text>
    <text x="496" y="155" font-size="21" font-weight="700" fill="#065f46">上传安装包</text>
    <text x="456" y="194" font-size="16" fill="#047857">· 拖入 zip / jar（单包 ≤ 200MB）</text>
    <text x="456" y="222" font-size="16" fill="#047857">· 自动算 SHA256 并登记</text>
    <text x="456" y="250" font-size="15" fill="#059669">目标机二次校验，防止传损坏</text>
    <rect x="456" y="265" width="288" height="1" fill="#a7f3d0"/>

    <!-- Step 3 -->
    <rect x="820" y="110" width="340" height="180" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <circle cx="856" cy="148" r="19" fill="#ea580c"/>
    <text x="856" y="155" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">3</text>
    <text x="886" y="155" font-size="21" font-weight="700" fill="#7c2d12">脚本与确认</text>
    <text x="846" y="194" font-size="16" fill="#9a3412">· 前置校验脚本（可选）</text>
    <text x="846" y="222" font-size="16" fill="#9a3412">· 部署后脚本（可选）</text>
    <text x="846" y="250" font-size="15" fill="#c2410c">生产环境输入 6 位动态口令</text>
    <rect x="846" y="265" width="288" height="1" fill="#fed7aa"/>

    <g stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ar2)">
      <path d="M382 200 H426"/>
      <path d="M772 200 H816"/>
    </g>

    <rect x="40" y="316" width="1120" height="42" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="60" y="343" font-size="16" fill="#374151">提交后到「任务 → 任务详情」看步骤日志；失败原因、脚本内容、审计记录都留在任务号下。</text>
  </g>
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
